<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中文閃卡</title>
    <style>
        :root { --primary-color: #4CAF50; --error-color: #e74c3c; --bg-color: #f0f2f5; --card-white: #ffffff; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background-color: var(--bg-color); margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
        
        /* 頂部導覽與生命值 */
        .header { width: 100%; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10; }
        .lives-display { font-size: 20px; color: var(--error-color); font-weight: bold; }
        
        .main-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; padding: 10px; box-sizing: border-box; position: relative; }
        
        /* 閃卡樣式 */
        .card-container { perspective: 1000px; width: 95%; max-width: 500px; height: 45vh; max-height: 400px; cursor: pointer; }
        .card { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; border-radius: 25px; box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .card.is-flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 25px; padding: 20px; box-sizing: border-box; text-align: center; word-break: break-all; }
        .card-front { background: var(--card-white); }
        .card-back { background: #fffdf0; transform: rotateY(180deg); border: 3px dashed var(--secondary-color); }
        #word-display { font-weight: 900; color: #2c3e50; transition: font-size 0.2s; }
        
        /* 控制按鈕區 */
        .btn-group { margin-top: 30px; display: flex; gap: 15px; align-items: center; }
        .btn { padding: 15px 40px; font-size: 1.2rem; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-next { background-color: var(--primary-color); box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3); }
        .btn-wrong { background-color: var(--error-color); padding: 15px 25px; font-size: 1.5rem; }
        .btn:active { transform: scale(0.9); }

        /* 遊戲結束爆炸畫面 */
        #game-over-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        .boom-text { font-size: 80px; font-weight: 900; color: #f39c12; animation: boom 0.5s infinite alternate; }
        @keyframes boom { from { transform: scale(1); } to { transform: scale(1.2); } }

        /* 設定彈窗 */
        #settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; padding: 20px; box-sizing: border-box; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; max-width: 500px; margin: auto; max-height: 90vh; overflow-y: auto; }
        .setting-item { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .error-list { background: #fff5f5; border-radius: 8px; padding: 10px; margin-top: 10px; font-size: 14px; }
        .error-item { padding: 5px; border-bottom: 1px solid #ffdada; }
    </style>
</head>
<body>

    <div class="header">
        <div class="lives-display" id="hp-bar">❤️❤️❤️❤️❤️</div>
        <div class="header-btns">
            <button class="icon-btn" style="background:none; border:none; font-size:24px;" onclick="toggleModal()">⚙️</button>
        </div>
    </div>

    <div class="main-container">
        <div class="slider-container" style="display:flex; align-items:center; gap:10px; margin-bottom:20px; background:white; padding:5px 15px; border-radius:20px;">
            <span style="font-size:12px;">A</span>
            <input type="range" min="30" max="200" value="80" id="fontSlider" oninput="updateFS()">
            <span style="font-size:20px; font-weight:bold;">A</span>
        </div>

        <div class="card-container" onclick="flipCard()">
            <div class="card" id="card">
                <div class="card-face card-front"><div id="word-display">載入中...</div></div>
                <div class="card-face card-back"><div id="pinyin-display" style="color:#f39c12; font-weight:bold;"></div><div id="meaning-display" style="color:#7f8c8d; margin-top:10px;"></div></div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-next" onclick="nextCard(event)">下一張</button>
            <button class="btn btn-wrong" onclick="markWrong(event)">✕</button>
        </div>
    </div>

    <div id="game-over-overlay">
        <div class="boom-text">💥 BOOM!</div>
        <h2>生命值已耗盡</h2>
        <div id="error-summary" style="margin: 20px; color: #ccc;"></div>
        <button class="btn btn-next" onclick="restartGame()">重新開始</button>
    </div>

    <div id="settings-modal">
        <div class="modal-content">
            <h3>遊戲設定與清單</h3>
            
            <div class="setting-item">
                <label>設定初始生命格數 (1-10)：</label><br>
                <input type="number" id="max-hp-input" min="1" max="10" value="5" style="padding:8px; width:60px; margin-top:5px;">
            </div>

            <div class="setting-item">
                <p><b>🔗 從網址讀取字庫：</b></p>
                <select id="preset-urls" style="width:100%; padding:8px; margin-bottom:10px;" onchange="document.getElementById('remote-url').value = this.value">
                    <option value="">-- 選擇網址 --</option>
                    <option value="https://raw.githubusercontent.com/chin7521/flashcard/refs/heads/main/vocab_Vol1.json">Vol1</option>
                    <option value="https://raw.githubusercontent.com/chin7521/flashcard/refs/heads/main/vocab_Vol2_L1-L6.json">Vol L1-L6</option>
                    <option value="https://raw.githubusercontent.com/chin7521/flashcard/refs/heads/main/vocab_Vol2_L7-L12.json">Vol2 L7-L12</option>
                </select>
                <div style="display:flex; gap:5px;">
                    <input type="text" id="remote-url" placeholder="JSON 網址" style="flex:1; padding:8px;">
                    <button onclick="importFromURL()" style="background:#24292e; color:white; border:none; padding:8px; border-radius:5px;">匯入</button>
                </div>
            </div>

            <div class="setting-item">
                <p><b>❌ 錯誤清單 (本輪)：</b></p>
                <div id="error-list-container" class="error-list">尚無錯誤記錄</div>
            </div>

            <button onclick="toggleModal()" style="width:100%; padding:12px; background:#34495e; color:white; border:none; border-radius:10px; font-weight:bold;">關閉</button>
        </div>
    </div>

    <script>
        let vocabulary = JSON.parse(localStorage.getItem('myVocab')) || [{kanji: "挑戰", pinyin: "tiǎo zhàn", meaning: "Challenge"}];
        let currentIndex = -1;
        let errorList = [];
        let currentHp = 5;
        let maxHp = 5;
        const synth = window.speechSynthesis;

        // --- 生命值系統 ---
        function updateHpBar() {
            const bar = document.getElementById('hp-bar');
            bar.innerText = "❤️".repeat(currentHp) + "🖤".repeat(maxHp - currentHp);
            if (currentHp <= 0) gameOver();
        }

        function gameOver() {
            document.getElementById('game-over-overlay').style.display = 'flex';
            const summary = document.getElementById('error-summary');
            summary.innerHTML = errorList.length > 0 ? 
                `你記錯了 ${errorList.length} 個字：<br>${errorList.map(i => i.kanji).join('、')}` : 
                "雖然生命耗盡，但你沒有記錯任何單字。";
        }

        function restartGame() {
            maxHp = parseInt(document.getElementById('max-hp-input').value) || 5;
            currentHp = maxHp;
            errorList = [];
            document.getElementById('game-over-overlay').style.display = 'none';
            renderErrorList();
            updateHpBar();
            nextCard();
        }

        function markWrong(event) {
            if(event) event.stopPropagation();
            if(currentIndex === -1) return;
            
            // 扣血
            currentHp--;
            updateHpBar();

            // 加入錯誤清單 (不重複加入)
            const currentItem = vocabulary[currentIndex];
            if (!errorList.some(item => item.kanji === currentItem.kanji)) {
                errorList.push(currentItem);
                renderErrorList();
            }

            // 扣血後自動切換下一張
            if (currentHp > 0) nextCard();
        }

        // --- 閃卡邏輯 ---
        function speak(text) { synth.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-TW'; synth.speak(u); }
        function flipCard() { document.getElementById('card').classList.toggle('is-flipped'); if(currentIndex>=0) speak(vocabulary[currentIndex].kanji); }
        
        function nextCard(event) {
            if(event) event.stopPropagation();
            if(vocabulary.length === 0) return;
            document.getElementById('card').classList.remove('is-flipped');
            setTimeout(() => {
                let nextIdx;
                do { nextIdx = Math.floor(Math.random() * vocabulary.length); } while (nextIdx === currentIndex && vocabulary.length > 1);
                currentIndex = nextIdx;
                const item = vocabulary[currentIndex];
                document.getElementById('word-display').innerText = item.kanji;
                document.getElementById('pinyin-display').innerText = item.pinyin || "";
                document.getElementById('meaning-display').innerText = item.meaning || "";
                speak(item.kanji);
            }, 200);
        }

        // --- 管理功能 ---
        function renderErrorList() {
            const container = document.getElementById('error-list-container');
            if (errorList.length === 0) {
                container.innerText = "尚無錯誤記錄";
                return;
            }
            container.innerHTML = errorList.map(item => `<div class="error-item"><b>${item.kanji}</b> - ${item.pinyin || ''} ${item.meaning}</div>`).join('');
        }

        async function importFromURL() {
            const url = document.getElementById('remote-url').value.trim();
            if (!url) return;
            try {
                const response = await fetch(url.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/"));
                const data = await response.json();
                if (Array.isArray(data)) {
                    vocabulary = data;
                    localStorage.setItem('myVocab', JSON.stringify(vocabulary));
                    alert(`成功讀取 ${data.length} 個單字`);
                    restartGame();
                    toggleModal();
                }
            } catch (err) { alert("匯入失敗，請確認網址。"); }
        }

        function toggleModal() {
            const m = document.getElementById('settings-modal');
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
        }

        function updateFS() {
            const s = document.getElementById('fontSlider').value;
            document.getElementById('word-display').style.fontSize = s + "px";
        }

        window.onload = () => {
            updateFS();
            restartGame(); // 初始化遊戲狀態
        };
    </script>
</body>
</html>
