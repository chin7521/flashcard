<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中文閃卡 - 彈性自定義版</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #f39c12;
            --bg-color: #f0f2f5;
            --card-white: #ffffff;
            --card-back: #fffdf0;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .settings-btn { background: none; border: none; font-size: 24px; cursor: pointer; }

        /* 編輯彈窗 */
        #settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .input-group input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .add-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .vocab-list-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 5px;
            border-bottom: 1px solid #eee;
            align-items: center;
        }

        .delete-btn { color: #e74c3c; cursor: pointer; border: none; background: none; font-weight: bold; }

        /* 閃卡樣式 */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .slider-container { margin: 15px; display: flex; align-items: center; gap: 10px; }
        .card-container { perspective: 1000px; width: 85%; max-width: 450px; height: 300px; cursor: pointer; }
        .card { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .card.is-flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 20px; padding: 25px; box-sizing: border-box; text-align: center; }
        .card-front { background: var(--card-white); }
        .card-back { background: var(--card-back); transform: rotateY(180deg); border: 2px dashed var(--secondary-color); }

        #word-display { font-weight: 700; color: #2c3e50; line-height: 1.2; }
        #pinyin-display { color: var(--secondary-color); margin-bottom: 8px; font-style: italic; }
        #meaning-display { color: #7f8c8d; line-height: 1.4; }

        .btn-group { margin: 30px 0; }
        .btn { padding: 15px 50px; font-size: 1.2rem; background-color: var(--primary-color); color: white; border: none; border-radius: 50px; font-weight: bold; }
        .close-modal-btn { background: #34495e; width: 100%; padding: 12px; margin-top: 15px; border-radius: 8px; color: white; border: none; font-size: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold; font-size: 1.1rem;">中文閃卡 Pro</div>
        <button class="settings-btn" onclick="toggleModal()">⚙️</button>
    </div>

    <div class="main-container">
        <div class="slider-container">
            <span style="font-size: 12px;">小</span>
            <input type="range" min="30" max="120" value="70" id="fontSlider">
            <span style="font-size: 12px;">大</span>
        </div>

        <div class="card-container" onclick="flipCard()">
            <div class="card" id="card">
                <div class="card-face card-front">
                    <div id="word-display">載入中...</div>
                </div>
                <div class="card-face card-back">
                    <div id="pinyin-display"></div>
                    <div id="meaning-display"></div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="nextCard(event)">下一張</button>
        </div>
    </div>

    <div id="settings-modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">編輯清單</h3>
            <p style="font-size: 12px; color: #666;">* 僅「中文字」為必填</p>
            <div class="input-group">
                <input type="text" id="new-word" placeholder="中文字 (必填)">
                <input type="text" id="new-pinyin" placeholder="拼音 (選填)">
                <input type="text" id="new-meaning" placeholder="意義 (選填)">
                <button class="add-btn" onclick="addVocab()">新增到清單</button>
            </div>
            <div id="vocab-list-container" style="max-height: 250px; overflow-y: auto; border-top: 1px solid #eee;">
                </div>
            <button class="close-modal-btn" onclick="toggleModal()">完成並儲存</button>
            <button onclick="resetDefault()" style="width:100%; margin-top:10px; background:none; border:none; color:#999; font-size: 11px; text-decoration: underline;">恢復預設範例</button>
        </div>
    </div>

    <script>
        const defaultVocab = [
            {kanji: "學習", pinyin: "xué xí", meaning: "To learn"},
            {kanji: "謝謝", pinyin: "", meaning: "Thanks (無拼音範例)"}
        ];

        let vocabulary = JSON.parse(localStorage.getItem('myVocab')) || defaultVocab;
        let currentIndex = -1;
        const synth = window.speechSynthesis;

        function saveToLocal() {
            localStorage.setItem('myVocab', JSON.stringify(vocabulary));
            renderVocabList();
        }

        function speak(text) {
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-TW';
            utter.rate = 0.9;
            synth.speak(utter);
        }

        function flipCard() {
            document.getElementById('card').classList.toggle('is-flipped');
            if (currentIndex >= 0) speak(vocabulary[currentIndex].kanji);
        }

        function nextCard(event) {
            if(event) event.stopPropagation();
            if(vocabulary.length === 0) {
                document.getElementById('word-display').innerText = "請新增單字";
                return;
            }
            document.getElementById('card').classList.remove('is-flipped');
            
            setTimeout(() => {
                let nextIndex;
                if (vocabulary.length > 1) {
                    do { nextIndex = Math.floor(Math.random() * vocabulary.length); } while (nextIndex === currentIndex);
                } else {
                    nextIndex = 0;
                }
                
                currentIndex = nextIndex;
                const item = vocabulary[currentIndex];
                
                document.getElementById('word-display').innerText = item.kanji;
                
                // 處理拼音顯示邏輯
                const pyEl = document.getElementById('pinyin-display');
                pyEl.innerText = item.pinyin || "";
                pyEl.style.display = item.pinyin ? "block" : "none";

                // 處理意義顯示邏輯
                const meEl = document.getElementById('meaning-display');
                meEl.innerText = item.meaning || "";
                meEl.style.display = item.meaning ? "block" : "none";

                speak(item.kanji);
            }, 200);
        }

        function toggleModal() {
            const modal = document.getElementById('settings-modal');
            const isVisible = modal.style.display === 'block';
            modal.style.display = isVisible ? 'none' : 'block';
            if(isVisible) nextCard(); 
        }

        function renderVocabList() {
            const container = document.getElementById('vocab-list-container');
            container.innerHTML = '';
            vocabulary.forEach((item, index) => {
                container.innerHTML += `
                    <div class="vocab-list-item">
                        <span style="font-size:14px;"><b>${item.kanji}</b> ${item.pinyin ? '<small>('+item.pinyin+')</small>' : ''}</span>
                        <button class="delete-btn" onclick="removeVocab(${index})">✕</button>
                    </div>
                `;
            });
        }

        function addVocab() {
            const k = document.getElementById('new-word').value.trim();
            const p = document.getElementById('new-pinyin').value.trim();
            const m = document.getElementById('new-meaning').value.trim();
            
            if(k) { // 只要有中文字就允許新增
                vocabulary.push({kanji: k, pinyin: p, meaning: m});
                saveToLocal();
                document.getElementById('new-word').value = '';
                document.getElementById('new-pinyin').value = '';
                document.getElementById('new-meaning').value = '';
                document.getElementById('new-word').focus();
            } else {
                alert("請至少輸入中文字！");
            }
        }

        function removeVocab(index) {
            vocabulary.splice(index, 1);
            saveToLocal();
        }

        function resetDefault() {
            if(confirm("確定要恢復預設範例嗎？這會清除你目前的清單。")) {
                vocabulary = [...defaultVocab];
                saveToLocal();
            }
        }

        const fontSlider = document.getElementById('fontSlider');
        fontSlider.addEventListener('input', (e) => {
            const size = e.target.value;
            document.getElementById('word-display').style.fontSize = size + "px";
            document.getElementById('pinyin-display').style.fontSize = (size * 0.45) + "px";
            document.getElementById('meaning-display').style.fontSize = (size * 0.4) + "px";
        });

        window.onload = () => {
            renderVocabList();
            const initialSize = fontSlider.value;
            document.getElementById('word-display').style.fontSize = initialSize + "px";
            nextCard();
        };
    </script>
</body>
</html>
