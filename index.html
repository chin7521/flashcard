<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中文閃卡 - 支援匯出入版</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #f39c12;
            --bg-color: #f0f2f5;
            --card-white: #ffffff;
            --card-back: #fffdf0;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            width: 100%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .settings-btn { background: none; border: none; font-size: 24px; cursor: pointer; }

        /* 彈窗樣式 */
        #settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .input-group input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .add-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .vocab-list-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 5px;
            border-bottom: 1px solid #eee;
            align-items: center;
        }

        .delete-btn { color: #e74c3c; cursor: pointer; border: none; background: none; font-weight: bold; }

        /* 匯出入區塊 */
        .backup-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #eee;
            display: flex;
            gap: 10px;
        }

        .backup-btn {
            flex: 1;
            padding: 8px;
            font-size: 13px;
            border-radius: 5px;
            border: 1px solid #ccc;
            background: #f9f9f9;
            cursor: pointer;
        }

        /* 閃卡與原本樣式 */
        .main-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .slider-container { margin: 15px; display: flex; align-items: center; gap: 10px; }
        .card-container { perspective: 1000px; width: 85%; max-width: 450px; height: 300px; cursor: pointer; }
        .card { width: 100%; height: 100%; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .card.is-flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 20px; padding: 25px; box-sizing: border-box; text-align: center; }
        .card-front { background: var(--card-white); }
        .card-back { background: var(--card-back); transform: rotateY(180deg); border: 2px dashed var(--secondary-color); }

        #word-display { font-weight: 700; color: #2c3e50; }
        #pinyin-display { color: var(--secondary-color); margin-bottom: 8px; }
        #meaning-display { color: #7f8c8d; }

        .btn-group { margin: 30px 0; }
        .btn { padding: 15px 50px; font-size: 1.2rem; background-color: var(--primary-color); color: white; border: none; border-radius: 50px; font-weight: bold; }
        .close-modal-btn { background: #34495e; width: 100%; padding: 12px; margin-top: 15px; border-radius: 8px; color: white; border: none; font-size: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold;">中文閃卡 Pro</div>
        <button class="settings-btn" onclick="toggleModal()">⚙️</button>
    </div>

    <div class="main-container">
        <div class="slider-container">
            <span style="font-size: 12px;">小</span>
            <input type="range" min="30" max="120" value="70" id="fontSlider">
            <span style="font-size: 12px;">大</span>
        </div>

        <div class="card-container" onclick="flipCard()">
            <div class="card" id="card">
                <div class="card-face card-front">
                    <div id="word-display">載入中...</div>
                </div>
                <div class="card-face card-back">
                    <div id="pinyin-display"></div>
                    <div id="meaning-display"></div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="nextCard(event)">下一張</button>
        </div>
    </div>

    <div id="settings-modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">編輯清單</h3>
            <div class="input-group">
                <input type="text" id="new-word" placeholder="中文字 (必填)">
                <input type="text" id="new-pinyin" placeholder="拼音 (選填)">
                <input type="text" id="new-meaning" placeholder="意義 (選填)">
                <button class="add-btn" onclick="addVocab()">新增單字</button>
            </div>
            
            <div id="vocab-list-container" style="max-height: 200px; overflow-y: auto; border-top: 1px solid #eee;"></div>

            <div class="backup-section">
                <button class="backup-btn" onclick="exportVocab()">📤 匯出備份 (JSON)</button>
                <button class="backup-btn" onclick="document.getElementById('importFile').click()">📥 匯入清單</button>
                <input type="file" id="importFile" style="display:none" accept=".json" onchange="importVocab(event)">
            </div>

            <button class="close-modal-btn" onclick="toggleModal()">關閉設定</button>
        </div>
    </div>

    <script>
        const defaultVocab = [{kanji: "歡迎", pinyin: "huān yíng", meaning: "Welcome"}];
        let vocabulary = JSON.parse(localStorage.getItem('myVocab')) || defaultVocab;
        let currentIndex = -1;
        const synth = window.speechSynthesis;

        function saveToLocal() {
            localStorage.setItem('myVocab', JSON.stringify(vocabulary));
            renderVocabList();
        }

        function speak(text) {
            synth.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'zh-TW';
            utter.rate = 0.9;
            synth.speak(utter);
        }

        function flipCard() {
            document.getElementById('card').classList.toggle('is-flipped');
            if (currentIndex >= 0) speak(vocabulary[currentIndex].kanji);
        }

        function nextCard(event) {
            if(event) event.stopPropagation();
            if(vocabulary.length === 0) {
                document.getElementById('word-display').innerText = "請新增單字";
                return;
            }
            document.getElementById('card').classList.remove('is-flipped');
            setTimeout(() => {
                currentIndex = Math.floor(Math.random() * vocabulary.length);
                const item = vocabulary[currentIndex];
                document.getElementById('word-display').innerText = item.kanji;
                document.getElementById('pinyin-display').innerText = item.pinyin || "";
                document.getElementById('meaning-display').innerText = item.meaning || "";
                speak(item.kanji);
            }, 200);
        }

        function toggleModal() {
            const modal = document.getElementById('settings-modal');
            const isVisible = modal.style.display === 'block';
            modal.style.display = isVisible ? 'none' : 'block';
            if(isVisible) nextCard(); 
        }

        function renderVocabList() {
            const container = document.getElementById('vocab-list-container');
            container.innerHTML = '';
            vocabulary.forEach((item, index) => {
                container.innerHTML += `
                    <div class="vocab-list-item">
                        <span><b>${item.kanji}</b></span>
                        <button class="delete-btn" onclick="removeVocab(${index})">✕</button>
                    </div>
                `;
            });
        }

        function addVocab() {
            const k = document.getElementById('new-word').value.trim();
            const p = document.getElementById('new-pinyin').value.trim();
            const m = document.getElementById('new-meaning').value.trim();
            if(k) {
                vocabulary.push({kanji: k, pinyin: p, meaning: m});
                saveToLocal();
                document.querySelectorAll('.input-group input').forEach(i => i.value = '');
            }
        }

        function removeVocab(index) {
            vocabulary.splice(index, 1);
            saveToLocal();
        }

        // --- 匯出功能 ---
        function exportVocab() {
            const dataStr = JSON.stringify(vocabulary, null, 2);
            const blob = new Blob([dataStr], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `vocab_backup_${new Date().toLocaleDateString()}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // --- 匯入功能 ---
        function importVocab(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        if(confirm(`偵測到 ${importedData.length} 個單字，是否要覆蓋目前的清單？`)) {
                            vocabulary = importedData;
                            saveToLocal();
                            alert("匯入成功！");
                        }
                    } else {
                        alert("格式錯誤，請確保檔案是正確的 JSON 格式。");
                    }
                } catch (err) {
                    alert("讀取失敗：" + err);
                }
            };
            reader.readAsText(file);
        }

        const fontSlider = document.getElementById('fontSlider');
        fontSlider.addEventListener('input', (e) => {
            const size = e.target.value;
            document.getElementById('word-display').style.fontSize = size + "px";
        });

        window.onload = () => {
            renderVocabList();
            nextCard();
        };
    </script>
</body>
</html>
